    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            overflow: hidden;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Leaflet Map Custom Marker Styles */
        .custom-div-icon {
            background: transparent;
            border: none;
        }

        .marker-pin {
            width: 36px;
            height: 36px;
            border-radius: 50% 50% 50% 0;
            position: absolute;
            transform: rotate(-45deg);
            left: 50%;
            top: 50%;
            margin: -20px 0 0 -18px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: all 0.2s ease-in-out;
        }

        .marker-pin::after {
            content: '';
            width: 20px;
            height: 20px;
            margin: 8px 0 0 8px;
            background: #fff;
            position: absolute;
            border-radius: 50%;
        }

        .marker-pin i {
            transform: rotate(45deg);
            z-index: 10;
            font-size: 14px;
        }

        .marker-pin.active {
            transform: rotate(-45deg) scale(1.25);
            z-index: 1000 !important;
        }

        /* Pulse animation for active pin */
        @keyframes pinPulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.15); opacity: 0.4; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        /* Custom Popup Styling */
        .leaflet-popup-content-wrapper {
            padding: 0;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
        .leaflet-popup-content {
            margin: 0;
            width: 260px !important;
        }
        .leaflet-container a.leaflet-popup-close-button {
            top: 8px;
            right: 8px;
            color: #fff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
            font-size: 18px;
            z-index: 10;
        }

        /* Glassmorphism support */
        .glass {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>

                image: 'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=800&q=80',
                description: '世界級的大理石峽谷景觀，雄偉絕壁、湍急溪流與九曲洞、燕子口等步道，展現大自然鬼斧神工的磅礡氣勢。',
                hours: '24小時開放 (步道開放狀況需依官方公告)',
                address: '花蓮縣秀林鄉富世291號'
            },
            {
                id: 'spot-11',
                name: '三仙台風景區',
                region: '東部',
                city: '臺東縣成功鎮',
                category: '自然風光',
                lat: 23.1281,
                lng: 121.4111,
                rating: 4.6,
                image: 'https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=800&q=80',
                description: '由離岸小島與地質海蝕景觀組成，最吸睛的亮點是如長龍般跨越海面的八拱跨海步橋，更是迎接全台第一道曙光的熱門地點。',
                hours: '08:30 - 17:00',
                address: '臺東縣成功鎮基翬路74號'
            },
            {
                id: 'spot-12',
                name: '澎湖跨海大橋',
                region: '離島',
                city: '澎湖縣白沙鄉',
                category: '歷史人文',
                lat: 23.6508,
                lng: 119.5303,
                rating: 4.5,
                image: 'https://images.unsplash.com/photo-1519046904884-53103b34b206?auto=format&fit=crop&w=800&q=80',
                description: '連接白沙鄉與西嶼鄉的著名標誌性大橋，全長近2.5公里。橋頭白色拱門是前往澎湖旅遊必拍照打卡地標。',
                hours: '全天開放',
                address: '澎湖縣白沙鄉通梁村'
            }
        ];

        // ==========================================
        // 2. Application State & Colors
        // ==========================================
        let map;
        let markersGroup;
        let activeMarker = null;
        
        let state = {
            searchQuery: '',
            selectedRegion: 'all',
            selectedCategory: 'all',
            showFavoritesOnly: false,
            favorites: JSON.parse(localStorage.getItem('taiwan_travel_favs') || '[]'),
            currentMobileView: 'map' // 'map' or 'list'
        };

        // Category icon & color mapping
        const CATEGORY_STYLES = {
            '自然風光': { icon: 'fa-tree', color: '#10b981' },
            '歷史人文': { icon: 'fa-landmark', color: '#f59e0b' },
            '休閒農場': { icon: 'fa-tractor', color: '#84cc16' },
            '藝術文化': { icon: 'fa-palette', color: '#8b5cf6' },
            '特色商圈': { icon: 'fa-store', color: '#ec4899' },
            'default': { icon: 'fa-location-dot', color: '#3b82f6' }
        };

        // ==========================================
        // 3. Map Initialization
        // ==========================================
        function initMap() {
            // Taiwan geographic center coords: ~23.8, 120.9, Zoom level 8
            map = L.map('map', {
                zoomControl: false
            }).setView([23.8, 120.9], 8);

            // Add standard Leaflet Zoom Control to Top Right
            L.control.zoom({ position: 'topright' }).addTo(map);

            // OpenStreetMap Tile Layer
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(map);

            // Create LayerGroup for markers
            markersGroup = L.layerGroup().addTo(map);
        }

        // ==========================================
        // 4. Marker Rendering & Interactions
        // ==========================================
        function createCustomIcon(category, isActive = false) {
            const config = CATEGORY_STYLES[category] || CATEGORY_STYLES['default'];
            const activeClass = isActive ? 'active' : '';
            
            const html = `
                <div class="marker-pin ${activeClass}" style="background-color: ${config.color}">
                    <i class="fa-solid ${config.icon} text-white"></i>
                </div>
            `;

            return L.divIcon({
                className: 'custom-div-icon',
                html: html,
                iconSize: [36, 36],
                iconAnchor: [18, 36],
                popupAnchor: [0, -32]
            });
        }

        function renderMarkers(attractions) {
            markersGroup.clearLayers();

            attractions.forEach(item => {
                const isFav = state.favorites.includes(item.id);
                const marker = L.marker([item.lat, item.lng], {
                    icon: createCustomIcon(item.category)
                });

                // Attach metadata to marker instance
                marker.attractionId = item.id;

                // Popup content HTML
                const popupHtml = `
                    <div class="overflow-hidden">
                        <div class="relative h-28 bg-slate-200">
                            <img src="${item.image}" alt="${item.name}" class="w-full h-full object-cover">
                            <span class="absolute top-2 left-2 bg-slate-900/80 text-white text-[10px] px-2 py-0.5 rounded-full backdrop-blur-sm">
                                ${item.category}
                            </span>
                        </div>
                        <div class="p-3">
                            <div class="flex items-center justify-between mb-1">
                                <h4 class="font-bold text-slate-800 text-sm leading-tight">${item.name}</h4>
                                <div class="text-xs font-semibold text-amber-500 flex items-center">
                                    <i class="fa-solid fa-star me-1 text-[10px]"></i>${item.rating}
                                </div>
                            </div>
                            <p class="text-xs text-slate-500 mb-2 line-clamp-2">${item.description}</p>
                            <div class="flex items-center justify-between pt-1 border-t border-slate-100">
                                <button onclick="toggleFavorite('${item.id}')" class="text-xs ${isFav ? 'text-amber-500' : 'text-slate-400'} hover:text-amber-500 transition">
                                    <i class="${isFav ? 'fa-solid' : 'fa-regular'} fa-star me-1"></i>${isFav ? '已收藏' : '收藏'}
                                </button>
                                <button onclick="openDetailModal('${item.id}')" class="text-xs font-semibold text-brand-600 hover:text-brand-700">
                                    詳細資訊 <i class="fa-solid fa-chevron-right text-[10px]"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;

                marker.bindPopup(popupHtml);

                marker.on('click', () => {
                    highlightAttractionCard(item.id);
                });

                markersGroup.addLayer(marker);
            });
        }

        // ==========================================
        // 5. Attraction List Rendering
        // ==========================================
        function renderAttractionList(attractions) {
            const listEl = document.getElementById('attractions-list');
            const emptyEl = document.getElementById('empty-state');
            const countEl = document.getElementById('attraction-count');

            countEl.textContent = attractions.length;

            if (attractions.length === 0) {
                listEl.classList.add('hidden');
                emptyEl.classList.remove('hidden');
                return;
            }

            listEl.classList.remove('hidden');
            emptyEl.classList.add('hidden');

            listEl.innerHTML = attractions.map(item => {
                const isFav = state.favorites.includes(item.id);
                const categoryStyle = CATEGORY_STYLES[item.category] || CATEGORY_STYLES['default'];

                return `
                    <div id="card-${item.id}" 
                         onclick="selectAttraction('${item.id}')"
                         class="attraction-card bg-white rounded-xl p-3 border border-slate-200/80 hover:border-brand-500/50 hover:shadow-md transition cursor-pointer flex gap-3 group relative">
                        
                        <!-- Thumbnail Image -->
                        <div class="w-24 h-24 rounded-lg bg-slate-100 overflow-hidden shrink-0 relative">
                            <img src="${item.image}" alt="${item.name}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                            <span class="absolute top-1.5 left-1.5 bg-black/60 text-white text-[9px] px-1.5 py-0.5 rounded backdrop-blur-sm">
                                ${item.region}
                            </span>
                        </div>

                        <!-- Info Content -->
                        <div class="flex-1 min-w-0 flex flex-col justify-between">
                            <div>
                                <div class="flex items-start justify-between gap-1">
                                    <h3 class="font-bold text-slate-800 text-sm group-hover:text-brand-600 transition truncate">${item.name}</h3>
                                    <button onclick="event.stopPropagation(); toggleFavorite('${item.id}');" class="text-slate-300 hover:text-amber-500 p-1 transition">
                                        <i class="${isFav ? 'fa-solid text-amber-500' : 'fa-regular'} fa-star text-sm"></i>
                                    </button>
                                </div>
                                <div class="flex items-center gap-2 mt-0.5 mb-1 text-[11px] text-slate-500">
                                    <span class="inline-flex items-center gap-1" style="color: ${categoryStyle.color}">
                                        <i class="fa-solid ${categoryStyle.icon}"></i> ${item.category}
                                    </span>
                                    <span>•</span>
                                    <span class="text-amber-500 font-medium">
                                        <i class="fa-solid fa-star text-[10px] me-0.5"></i>${item.rating}
                                    </span>
                                </div>
                                <p class="text-xs text-slate-500 line-clamp-1">${item.description}</p>
                            </div>

                            <div class="flex items-center justify-between text-[11px] text-slate-400 pt-1">
                                <span class="truncate"><i class="fa-solid fa-location-dot me-1"></i>${item.city}</span>
                                <span class="text-brand-600 font-medium hover:underline flex items-center gap-0.5">
                                    查看細節
                                </span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ==========================================
        // 6. Filtering & Search Logic
        // ==========================================
        function getFilteredAttractions() {
            return TAIWAN_ATTRACTIONS.filter(item => {
                // Search match
                const matchSearch = state.searchQuery === '' || 
                    item.name.toLowerCase().includes(state.searchQuery.toLowerCase()) ||
                    item.city.toLowerCase().includes(state.searchQuery.toLowerCase()) ||
                    item.description.toLowerCase().includes(state.searchQuery.toLowerCase());

                // Region match
                const matchRegion = state.selectedRegion === 'all' || item.region === state.selectedRegion;

                // Category match
                const matchCategory = state.selectedCategory === 'all' || item.category === state.selectedCategory;

                // Favorites match
                const matchFav = !state.showFavoritesOnly || state.favorites.includes(item.id);

                return matchSearch && matchRegion && matchCategory && matchFav;
            });
        }

        function updateUI() {
            const filteredData = getFilteredAttractions();
            renderAttractionList(filteredData);
            renderMarkers(filteredData);
            updateFavoriteCounter();
        }

        function selectAttraction(id) {
            const item = TAIWAN_ATTRACTIONS.find(a => a.id === id);
            if (!item) return;

            // Fly map to target attraction coordinates
            map.flyTo([item.lat, item.lng], 13, {
                animate: true,
                duration: 1.2
            });

            // Find matching marker and open popup
            markersGroup.eachLayer(layer => {
                if (layer.attractionId === id) {
                    layer.openPopup();
                }
            });

            highlightAttractionCard(id);

            // On mobile view, automatically switch to map view when card clicked
            if (window.innerWidth < 768 && state.currentMobileView === 'list') {
                switchMobileView('map');
            }
        }

        function highlightAttractionCard(id) {
            document.querySelectorAll('.attraction-card').forEach(card => {
                card.classList.remove('border-brand-500', 'bg-brand-50/30', 'ring-1', 'ring-brand-500');
            });

            const targetCard = document.getElementById(`card-${id}`);
            if (targetCard) {
                targetCard.classList.add('border-brand-500', 'bg-brand-50/30', 'ring-1', 'ring-brand-500');
                targetCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        // ==========================================
        // 7. Favorites Management
        // ==========================================
        function toggleFavorite(id) {
            const index = state.favorites.indexOf(id);
            if (index > -1) {
                state.favorites.splice(index, 1);
            } else {
                state.favorites.push(id);
            }

            // Save to localStorage
            localStorage.setItem('taiwan_travel_favs', JSON.stringify(state.favorites));

            // Sync Modal favorite icon if open
            updateModalFavButton(id);

            // Update UI
            updateUI();
        }

        function updateFavoriteCounter() {
            const badge = document.getElementById('fav-count-badge');
            badge.textContent = state.favorites.length;
        }

        // ==========================================
        // 8. Detail Modal Operations
        // ==========================================
        function openDetailModal(id) {
            const item = TAIWAN_ATTRACTIONS.find(a => a.id === id);
            if (!item) return;

            document.getElementById('modal-img').src = item.image;
            document.getElementById('modal-title').textContent = item.name;
            document.getElementById('modal-category').textContent = item.category;
            document.getElementById('modal-rating').textContent = item.rating;
            document.getElementById('modal-location').querySelector('span').textContent = `${item.region} • ${item.city}`;
            document.getElementById('modal-description').textContent = item.description;
            document.getElementById('modal-hours').textContent = item.hours;
            document.getElementById('modal-address').textContent = item.address;

            // Navigation URL (Google Maps directions)
            const navUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.name)}&query_place_id=${item.lat},${item.lng}`;
            document.getElementById('modal-navigate-btn').href = navUrl;

            // Modal Favorite Button Action
            const favBtn = document.getElementById('modal-fav-btn');
            favBtn.onclick = () => toggleFavorite(item.id);
            updateModalFavButton(item.id);

            // Show Modal with smooth fade in
            const modal = document.getElementById('detail-modal');
            const card = document.getElementById('modal-card');
            
            modal.classList.remove('opacity-0', 'pointer-events-none');
            card.classList.remove('scale-95');
            card.classList.add('scale-100');
        }

        function closeModal() {
            const modal = document.getElementById('detail-modal');
            const card = document.getElementById('modal-card');
            
            modal.classList.add('opacity-0', 'pointer-events-none');
            card.classList.remove('scale-100');
            card.classList.add('scale-95');
        }

        function updateModalFavButton(id) {
            const isFav = state.favorites.includes(id);
            const favBtn = document.getElementById('modal-fav-btn');
            favBtn.innerHTML = `<i class="${isFav ? 'fa-solid text-amber-500' : 'fa-regular text-slate-500'} fa-star text-lg"></i>`;
        }

        // ==========================================
        // 9. Mobile RWD Switcher & Event Listeners
        // ==========================================
        function switchMobileView(view) {
            state.currentMobileView = view;
            const sidebar = document.getElementById('sidebar');
            const mapContainer = document.getElementById('map-container');
            const btnMap = document.getElementById('mobile-toggle-map');
            const btnList = document.getElementById('mobile-toggle-list');

            if (view === 'map') {
                sidebar.classList.add('hidden', 'md:flex');
                mapContainer.classList.remove('hidden');
                
                btnMap.className = "px-3 py-1 text-xs font-medium rounded-md bg-brand-500 text-white shadow";
                btnList.className = "px-3 py-1 text-xs font-medium rounded-md text-slate-300 hover:text-white";
                
                // Recalculate Leaflet map size on view toggle
                setTimeout(() => map.invalidateSize(), 100);
            } else {
                sidebar.classList.remove('hidden');
                sidebar.classList.add('w-full');
                mapContainer.classList.add('hidden', 'md:block');

                btnList.className = "px-3 py-1 text-xs font-medium rounded-md bg-brand-500 text-white shadow";
                btnMap.className = "px-3 py-1 text-xs font-medium rounded-md text-slate-300 hover:text-white";
            }
        }

        function setupEventListeners() {
            // Search Input Event
            const searchInput = document.getElementById('search-input');
            const clearSearchBtn = document.getElementById('clear-search');

            searchInput.addEventListener('input', (e) => {
                state.searchQuery = e.target.value.trim();
                clearSearchBtn.classList.toggle('hidden', state.searchQuery === '');
                updateUI();
            });

            clearSearchBtn.addEventListener('click', () => {
                searchInput.value = '';
                state.searchQuery = '';
                clearSearchBtn.classList.add('hidden');
                updateUI();
            });

            // Region Pill Buttons
            document.querySelectorAll('.region-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.region-btn').forEach(b => {
                        b.className = "region-btn px-3 py-1 rounded-lg text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition";
                    });
                    
                    e.target.className = "region-btn active px-3 py-1 rounded-lg text-xs font-medium bg-brand-600 text-white shadow-sm transition";
                    state.selectedRegion = e.target.getAttribute('data-region');
                    updateUI();
                });
            });

            // Category Select Dropdown
            document.getElementById('category-select').addEventListener('change', (e) => {
                state.selectedCategory = e.target.value;
                updateUI();
            });

            // Favorites Filter Toggle Button
            document.getElementById('btn-show-favorites').addEventListener('click', () => {
                state.showFavoritesOnly = !state.showFavoritesOnly;
                const btn = document.getElementById('btn-show-favorites');
                
                if (state.showFavoritesOnly) {
                    btn.classList.remove('bg-slate-800', 'text-amber-400', 'border-slate-700');
                    btn.classList.add('bg-amber-500', 'text-slate-900', 'border-amber-400');
                } else {
                    btn.classList.remove('bg-amber-500', 'text-slate-900', 'border-amber-400');
                    btn.classList.add('bg-slate-800', 'text-amber-400', 'border-slate-700');
                }
                updateUI();
            });

            // Reset All Filters
            const resetFilters = () => {
                state.searchQuery = '';
                state.selectedRegion = 'all';
                state.selectedCategory = 'all';
                state.showFavoritesOnly = false;

                document.getElementById('search-input').value = '';
                document.getElementById('clear-search').classList.add('hidden');
                document.getElementById('category-select').value = 'all';

                document.querySelectorAll('.region-btn').forEach(b => {
                    if (b.getAttribute('data-region') === 'all') {
                        b.className = "region-btn active px-3 py-1 rounded-lg text-xs font-medium bg-brand-600 text-white shadow-sm transition";
                    } else {
                        b.className = "region-btn px-3 py-1 rounded-lg text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition";
                    }
                });

                const favBtn = document.getElementById('btn-show-favorites');
                favBtn.className = "flex items-center space-x-1.5 bg-slate-800 hover:bg-slate-700 text-amber-400 px-3 py-1.5 rounded-lg text-sm font-medium transition border border-slate-700";

                map.setView([23.8, 120.9], 8);
                updateUI();
            };

            document.getElementById('btn-reset-filters').addEventListener('click', resetFilters);
            document.getElementById('btn-reset-empty').addEventListener('click', resetFilters);

            // Modal Close Events
            document.getElementById('close-modal').addEventListener('click', closeModal);
            document.getElementById('detail-modal').addEventListener('click', (e) => {
                if (e.target === document.getElementById('detail-modal')) {
                    closeModal();
                }
            });

            // Map Quick Tools
            document.getElementById('btn-fit-taiwan').addEventListener('click', () => {
                map.flyTo([23.8, 120.9], 8, { duration: 1 });
            });

            document.getElementById('btn-locate-me').addEventListener('click', () => {
                if ("geolocation" in navigator) {
                    navigator.geolocation.getCurrentPosition(position => {
                        const { latitude, longitude } = position.coords;
                        map.flyTo([latitude, longitude], 14, { duration: 1.2 });
                        L.popup()
                            .setLatLng([latitude, longitude])
                            .setContent('<div class="p-2 text-center text-xs font-bold text-slate-700">📍 您目前的位置</div>')
                            .openOn(map);
                    }, () => {
                        alert("無法取得您的位置權限。");
                    });
                } else {
                    alert("您的瀏覽器不支援地理定位功能。");
                }
            });

            // Mobile View Switches
            document.getElementById('mobile-toggle-map').addEventListener('click', () => switchMobileView('map'));
            document.getElementById('mobile-toggle-list').addEventListener('click', () => switchMobileView('list'));

            // Handle window resize logic
            window.addEventListener('resize', () => {
                if (window.innerWidth >= 768) {
                    document.getElementById('sidebar').classList.remove('hidden');
                    document.getElementById('map-container').classList.remove('hidden');
                }
            });
        }

        // ==========================================
        // 10. Application Entry Point
        // ==========================================
        window.onload = function () {
            initMap();
            setupEventListeners();
            updateUI();
        };
    </script>
</body>
</html>
